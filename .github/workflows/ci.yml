name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # node backs the test that syntax-checks the JavaScript the dashboard
      # writer emits. Without it those tests skip instead of failing.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # No `playwright install` on purpose: the suite never opens a browser, and
      # downloading Chromium would add minutes to every run for nothing.
      - name: Run tests
        run: python -m pytest tests -q
        env:
          PYTHONPATH: src
